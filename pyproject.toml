[build-system]
requires = [
  "setuptools==80.9.0",
  "wheel==0.46.1",
  "pybind11==3.1.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "catamaze-training"
version = "0.1.0"
description = "Deterministic recurrent-PPO training stack for CataMaze"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4",
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
]
train = [
  "PyYAML==6.0.3",
  "tensorboard==2.20.0",
  "torch==2.14.1",
]

[tool.setuptools.packages.find]
include = ["training*"]

[tool.pytest.ini_options]
testpaths = ["tests/training"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
