version: catamaze.reward.v1
cases:
  - name: simultaneous_player_kill
    current:
      status: death
      events:
        - [damage_applied, 0, 0, 1]
        - [damage_credit, 1, 0, 1]
        - [damage_credit, 2, 0, 1]
        - [entity_died, 0, 0, 0]
    expected:
      terminal: [20.0, 20.0, 20.0]
      player_combat: [5.0, 3.0, 0.0]
      total: [25.0, 23.0, 20.0]

  - name: player_escape
    current:
      status: victory
    expected:
      terminal: [-20.0, -20.0, -20.0]
      total: [-19.99995, -19.99998, -20.0]

  - name: timeout_bootstraps
    current:
      status: timeout
    expected:
      terminal: [10.0, 10.0, 10.0]
      total: [10.00005, 10.00002, 10.0]
      truncated: [true, true, true]

  - name: blocked_wall_nonterminal_cost
    current:
      last_result: [0, 2, 0, 0]
    expected:
      efficiency: [-0.022, -0.0005, -0.0015]
      total: [-0.02195, -0.00048, -0.0015]

  - name: player_damage_by_aggressive
    current:
      events:
        - [damage_applied, 0, 0, 1]
        - [damage_credit, 1, 0, 1]
    expected:
      player_combat: [2.0, 0.0, 0.0]
      total: [1.99805, -0.00048, -0.0015]

  - name: friendly_fire_and_kill
    current:
      alive: [true, true, false]
      events:
        - [damage_applied, 3, 3, 1]
        - [damage_credit, 1, 3, 1]
        - [damage_credit, 2, 3, 1]
        - [entity_died, 3, 3, 0]
    expected:
      friendly_fire: [-2.0, -2.0, 0.0]
      self_damage: [0.0, 0.0, -11.0]
      total: [-2.00195, -2.00048, -11.0015]

  - name: ammo_costs
    current:
      events:
        - [shot, 1, 1, 1]
        - [shot, 2, 2, 1]
        - [shot, 3, 3, 1]
    expected:
      ammo: [-0.01, -0.05, -0.03]
      total: [-0.01195, -0.05048, -0.0315]

  - name: first_visit_rewards
    current:
      positions: [[1, 1], [2, 3], [3, 4], [4, 5]]
      last_result: [0, 1, 1, 1]
    expected:
      exploration: [0.002, 0.005, 0.015]
      total: [0.00005, 0.00452, 0.0135]

  - name: revisit_costs
    current:
      last_result: [0, 1, 1, 1]
    expected:
      exploration: [-0.002, -0.002, -0.008]
      total: [-0.00395, -0.00248, -0.0095]

  - name: collision_costs
    current:
      last_result: [0, 3, 4, 5]
    expected:
      efficiency: [-0.007, -0.0055, -0.0215]
      total: [-0.00695, -0.00548, -0.0215]

  - name: invalid_fallback_cost
    current:
      last_result: [0, 9, 0, 0]
    expected:
      efficiency: [-0.102, -0.0005, -0.0015]
      total: [-0.10195, -0.00048, -0.0015]

  - name: potential_approach_and_retreat
    current:
      distance_to_player: [9, 21, 30]
    expected:
      potential: [0.001045, -0.000179, 0.0]
      total: [-0.000955, -0.000679, -0.0015]
