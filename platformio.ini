[platformio]
default_envs = native
src_dir = src
test_dir = test

[env]
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
lib_compat_mode = strict
lib_ldf_mode = deep+

[env:native]
platform = platformio/native@1.2.1
extra_scripts = pre:scripts/pio_native_deps.py
build_src_filter =
    -<*>
    +<native/>
build_flags =
    ${env.build_flags}
    -pthread
test_framework = googletest
test_build_src = no
test_filter = native/*
lib_deps =
    johboh/nlohmann-json@3.12.0
