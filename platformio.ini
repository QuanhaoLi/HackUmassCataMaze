[platformio]
default_envs = native
src_dir = src
test_dir = test

[env]
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
    -Werror
lib_compat_mode = strict
lib_ldf_mode = deep+

[env:native]
platform = platformio/native@1.2.1
extra_scripts = pre:scripts/pio_native_deps.py
build_src_filter =
    -<*>
    +<native/>
build_flags =
    ${env.build_flags}
    -pthread
test_framework = googletest
test_build_src = no
test_filter = native/*

[env:native_asan]
extends = env:native
build_type = debug
build_flags =
    ${env.build_flags}
    -pthread
    -O1
    -g
    -fsanitize=address
    -fno-omit-frame-pointer
build_unflags = -O2

[env:native_ubsan]
extends = env:native
build_type = debug
build_flags =
    ${env.build_flags}
    -pthread
    -O1
    -g
    -fsanitize=undefined
    -fno-sanitize-recover=all
    -fno-omit-frame-pointer
build_unflags = -O2

[env:native_coverage]
extends = env:native
build_type = debug
extra_scripts =
    pre:scripts/pio_native_deps.py
    pre:scripts/pio_coverage.py
build_flags =
    ${env.build_flags}
    -pthread
    -O0
    -g
    -fprofile-instr-generate
    -fcoverage-mapping
build_unflags = -O2

[env:native_randomized]
extends = env:native
build_type = release
build_src_filter =
    -<*>
    +<tools/randomized.cpp>

[env:esp32s3]
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/pio_policy_release.py
build_src_filter =
    -<*>
    +<esp32/>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.embed_files = src/esp32/model/catamaze_policy.espdl
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_protocol = esptool
upload_speed = 460800
monitor_speed = 115200

[env:esp32s3_diagnostic]
extends = env:esp32s3
extra_scripts =
board_build.embed_files =
build_src_filter =
    -<*>
    +<esp32_diagnostic/>
