[platformio]
default_envs = native
src_dir = src
test_dir = test

[env]
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
    -Werror
lib_compat_mode = strict
lib_ldf_mode = deep+

[env:native]
platform = platformio/native@1.2.1
extra_scripts = pre:scripts/pio_native_deps.py
build_src_filter =
    -<*>
    +<native/>
build_flags =
    ${env.build_flags}
    -pthread
test_framework = googletest
test_build_src = no
test_filter = native/*

[env:native_asan]
extends = env:native
build_type = debug
build_flags =
    ${env.build_flags}
    -pthread
    -O1
    -g
    -fsanitize=address
    -fno-omit-frame-pointer
build_unflags = -O2

[env:native_ubsan]
extends = env:native
build_type = debug
build_flags =
    ${env.build_flags}
    -pthread
    -O1
    -g
    -fsanitize=undefined
    -fno-sanitize-recover=all
    -fno-omit-frame-pointer
build_unflags = -O2

[env:native_coverage]
extends = env:native
build_type = debug
extra_scripts =
    pre:scripts/pio_native_deps.py
    pre:scripts/pio_coverage.py
build_flags =
    ${env.build_flags}
    -pthread
    -O0
    -g
    -fprofile-instr-generate
    -fcoverage-mapping
build_unflags = -O2

[env:native_randomized]
extends = env:native
build_type = release
build_src_filter =
    -<*>
    +<tools/randomized.cpp>
